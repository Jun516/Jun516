name: Deploy interactive dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'scripts/build_dashboard_data.py'
      - 'tests/test_dashboard_data.py'
      - 'tests/test_model.mjs'
      - '.github/workflows/deploy-dashboard.yml'
  schedule:
    - cron: '43 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run data and UI model tests
        run: |
          python -m unittest discover -s tests -p 'test_dashboard_data.py' -v
          node --test tests/test_model.mjs
          node --check dashboard/app.mjs
          node --check dashboard/model.mjs
          node --check dashboard/cases.mjs
      - name: Fetch real GitHub activity snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_dashboard_data.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
