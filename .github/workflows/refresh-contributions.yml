name: Refresh contribution leaderboard

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-contributions.yml'
      - 'scripts/update_contributions.py'
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: write

concurrency:
  group: contribution-leaderboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution table
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: Jun516
          MIN_STARS: '0'
        run: python3 scripts/update_contributions.py

      - name: Commit refreshed contribution showcase
        run: |
          git add -A -- README.md
          if [ -d assets/repo-icons ]; then
            git add -A -- assets/repo-icons
          fi
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh open-source contribution leaderboard"
          git push
