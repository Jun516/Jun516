name: Render GitHub profile metrics

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - profile-metrics-preview-20261101
    paths:
      - .github/workflows/profile-metrics.yml
  schedule:
    - cron: '47 2 * * *'

permissions:
  contents: write

concurrency:
  group: github-profile-metrics-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics with lowlighter/metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Jun516
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          committer_message: 'chore: refresh GitHub profile metrics [skip ci]'
          filename: assets/metrics/profile.svg
          output_action: commit
          template: classic
          base: ''
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          config_display: regular
          config_timezone: Asia/Singapore
          config_animations: no
